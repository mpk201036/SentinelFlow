[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow"
version = "0.1.0"
description = "AI-Assisted Security Alert Triage System with a human-in-the-loop design"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Miaad Salehinezamabadi", email = "proplus.salehi@gmail.com" }]
keywords = ["security", "soc", "triage", "mitre-attack", "detection", "blue-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mpk201036/SentinelFlow"
Repository = "https://github.com/mpk201036/SentinelFlow"
Issues = "https://github.com/mpk201036/SentinelFlow/issues"

[project.scripts]
sentinelflow = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

# The report templates ship inside the package: a report must render the same
# from an installed wheel as from a source checkout.
[tool.setuptools.package-data]
"app.reports" = ["templates/*.html", "templates/*.css"]

# Runtime resources live beside the source tree while developing and under
# ``share/sentinelflow`` in an installed wheel.  app.core.config resolves both
# layouts, so a release behaves the same as an editable checkout.
[tool.setuptools.data-files]
"share/sentinelflow/rules" = ["rules/*.yaml"]
"share/sentinelflow/data/context" = ["data/context/*.yaml"]
"share/sentinelflow/data/mitre" = ["data/mitre/*.json"]
"share/sentinelflow/data/samples" = ["data/samples/*.json", "data/samples/*.csv"]
"share/sentinelflow/dashboard/templates" = ["dashboard/templates/*.html"]
"share/sentinelflow/dashboard/static" = [
    "dashboard/static/*.css",
    "dashboard/static/*.js",
    "dashboard/static/*.svg",
]

# --------------------------------------------------------------------------
# Testing
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, isolated tests of a single component",
    "integration: tests that exercise several layers together",
    "ai: tests that require a local AI provider (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
# Everything is measured, the CLI included, and branches as well as lines: a
# number that leaves out the largest user-facing module flatters the suite.
source = ["app"]
branch = true

[tool.coverage.report]
# The floor CI enforces. Measured at 93% (lines and branches, CLI included)
# when it was set; the margin absorbs small refactors, not neglect.
fail_under = 90
skip_empty = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# --------------------------------------------------------------------------
# Linting / formatting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit security checks
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI express parameter metadata as call expressions in argument
# defaults. That is the documented API for both and the objects are immutable,
# so B008 ("mutable default") does not apply to them.
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design. Application code may not: python -O strips asserts,
# so a check written as one would vanish in an optimised run.
"tests/*" = ["S", "B011"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# Typing
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
