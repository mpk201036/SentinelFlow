# Credential access and authentication abuse.
#
# Rules are data. Adding a detection needs no Python change, and every field
# name and regex here is validated when the file loads - a typo fails at
# startup rather than producing a rule that silently never fires.

id: SF-0001
name: Repeated authentication failures
description: >
  Several failed logons for the same account on the same host within a short
  window. This is what a password-guessing attempt looks like, and also what a
  user with a stale cached credential, a misconfigured service account or a
  phone with an old Wi-Fi password looks like. The count matters more than any
  single failure, which is why this is a threshold rule.
severity: medium
confidence: high
mitre: [T1110]
tags: [credential_access, brute_force]
author: SentinelFlow
references:
  - https://attack.mitre.org/techniques/T1110/
false_positives:
  - A user who has just changed their password and has a device still using the old one.
  - A service account whose credential expired.
  - Backup or monitoring agents authenticating with stale configuration.
recommendation: >
  Check whether the failures stop after a successful logon for the same account
  - a success immediately following a burst is the pattern worth escalating.
  Confirm the source address is one the account would normally use, and ask the
  user directly before assuming compromise.
detection:
  event_types: [authentication_failure]
threshold:
  count: 5
  within_minutes: 10
  group_by: [hostname_key, username_key]

---
id: SF-0002
name: Successful logon from an external address
description: >
  An account authenticated successfully from an address that is not on an
  internal network. On its own this is normal for remote workers and VPN
  gateways. It matters as corroboration: the same account failing repeatedly
  and then succeeding from an external address is a different story.
severity: medium
confidence: medium
mitre: [T1078]
tags: [credential_access, valid_accounts]
references:
  - https://attack.mitre.org/techniques/T1078/
false_positives:
  - Remote workers, VPN concentrators and cloud-hosted jump boxes.
  - Any environment where the corporate range is not RFC1918.
recommendation: >
  Confirm the source address against the user's normal working pattern. Check
  whether the same account shows failed attempts shortly beforehand.
detection:
  event_types: [authentication_success]
  all:
    - field: src_ip
      operator: exists
      value: true
    - field: src_ip
      operator: is_private
      value: false
      label: is not on an internal network

---
id: SF-0009
name: Decoy credential accessed
description: >
  A credential planted specifically so that nothing legitimate would ever touch
  it was read. Deception signals are unusual in having very little background
  noise - there is no routine reason for a process to access one. That makes it
  high confidence, not a verdict: a misconfigured backup agent or the blue
  team's own testing can trip a decoy, which is exactly why a human confirms.
severity: high
confidence: high
mitre: [T1555]
tags: [credential_access, deception, ghostcredential]
references:
  - https://attack.mitre.org/techniques/T1555/
false_positives:
  - Backup, inventory or credential-scanning agents enumerating a store.
  - Authorised red-team or detection-validation exercises.
recommendation: >
  Identify the process and account that performed the read, and confirm whether
  the activity was authorised before acting. Check what else that account did
  on the host in the surrounding window.
detection:
  event_types: [decoy_credential_access]
