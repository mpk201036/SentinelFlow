name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, the long fuzzing run: 2,000 examples per property.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests

      # Enforced. It used to run with continue-on-error, so a type error could
      # never fail a build; the application and the tests are both checked now.
      - name: Type check (mypy)
        run: mypy app tests

      # Coverage covers lines and branches, the CLI included, and fails the
      # build below the floor set in pyproject.toml.
      - name: Test (pytest)
        env:
          SENTINELFLOW_ENVIRONMENT: test
        run: pytest --cov=app --cov-report=term

      - name: Verify the CLI works on a clean checkout
        run: |
          sentinelflow version
          sentinelflow doctor

  fuzz:
    name: Long property-based run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Hypothesis, thorough profile
        env:
          HYPOTHESIS_PROFILE: thorough
        run: pytest tests/test_properties.py -p no:cacheprovider

  package:
    name: Build and smoke-test the wheel
    if: github.event_name != 'schedule'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build release artifact
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install outside the checkout and run the demo
        run: |
          python -m venv "${RUNNER_TEMP}/sentinelflow-smoke"
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/pip" install dist/*.whl
          mkdir -p "${RUNNER_TEMP}/sentinelflow-work"
          cd "${RUNNER_TEMP}/sentinelflow-work"
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/sentinelflow" doctor
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/sentinelflow" init-db
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/sentinelflow" demo
