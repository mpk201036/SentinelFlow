name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, the long fuzzing run: 2,000 examples per property.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests

      # Enforced. It used to run with continue-on-error, so a type error could
      # never fail a build; the application and the tests are both checked now.
      - name: Type check (mypy)
        run: mypy app tests

      # Coverage covers lines and branches, the CLI included, and fails the
      # build below the floor set in pyproject.toml.
      - name: Test (pytest)
        env:
          SENTINELFLOW_ENVIRONMENT: test
        run: pytest --cov=app --cov-report=term

      - name: Verify the CLI works on a clean checkout
        run: |
          sentinelflow version
          sentinelflow doctor

  fuzz:
    name: Long property-based run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Hypothesis, thorough profile
        env:
          HYPOTHESIS_PROFILE: thorough
        run: pytest tests/test_properties.py -p no:cacheprovider
