name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Check tag matches the package version
        run: |
          package_version=$(python -c 'from app import __version__; print(__version__)')
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/sentinelflow-smoke"
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/pip" install dist/*.whl
          mkdir -p "${RUNNER_TEMP}/sentinelflow-work"
          cd "${RUNNER_TEMP}/sentinelflow-work"
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/sentinelflow" doctor
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/sentinelflow" init-db
          "${RUNNER_TEMP}/sentinelflow-smoke/bin/sentinelflow" demo

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
